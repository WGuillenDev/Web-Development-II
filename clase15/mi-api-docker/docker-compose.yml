services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-password123}"
      POSTGRES_DB: mi_base_datos
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mi_base_datos"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: "postgres://admin:${POSTGRES_PASSWORD:-password123}@db:5432/mi_base_datos"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
